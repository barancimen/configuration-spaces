# The lock between helix-tower segments: generated by examples/make_helixturm.py --lock.
# Segment i has a pin at each end; both slide radially into slots of earlier segments (i-1 beside
# it, i-N+1 above its right end). On their own these two pins only keep it from moving along the
# wall: it can still slide out, and swing about either end. What holds it are two later segments,
# each of which comes in along its own radial direction, turned by 2*pi/6 either way:
#   segment i+1    puts its left pin into the slot at segment i's right end
#   segment i+N-1  puts its right pin into the slot at segment i's lower left corner
# Two models of segment i, with the dimensions and clearances of helixturm.yaml.
#   solid   the joints' real shapes (fingers, pins, rails, end stops, the roof). Segment i moves
#           without turning (out, sideways, up); segments i+1 and i+N-1 may slide along their own
#           radial directions. Each round pin is replaced by an eight-sided one inside it, which
#           can only allow more motion.
#   flat    segment i moves in the plane and may turn. A round pin between two rails is a point
#           (its centre) in a channel as wide as the clearance; the claims state the four
#           channels as conditions. (With the real shapes and turning, z3 does not finish.)
# The 'held' claims say: within some neighbourhood of its place the segment is in a much smaller
# box. No pose in between is free of overlap, so it cannot leave the small box by moving.
#   python3 -m cspace examples/helixturm_lock.yaml --prove
name: helixturm_lock
bodies:
  world:
    frames:
      mid: {at: [0.185, 0, 0]}                # the middle of segment i's wall
      sx: {z: [1, 0, 0]}
      nextRad: {z: ["cos(2*pi/6)", "sin(2*pi/6)", 0]}      # the radial direction of segment i+1
      lowRad: {z: ["cos(-2*pi/6)", "sin(-2*pi/6)", 0]}     # ... and of segment i+N-1
      nextPin: {at: ["0.185*cos(1*2*pi/6) - (-0.10715)*sin(1*2*pi/6)", "0.185*sin(1*2*pi/6) + (-0.10715)*cos(1*2*pi/6)", 0]}        # where the left pin of segment i+1 stands
      lowPin: {at: ["0.185*cos(-1*2*pi/6) - (0.10715)*sin(-1*2*pi/6)", "0.185*sin(-1*2*pi/6) + (0.10715)*cos(-1*2*pi/6)", 0]}       # where the right pin of segment i+N-1 stands
  flat:                 # segment i in the plane: frames only
    frames:
      mid: {at: [0.185, 0, 0]}
      pinL: {at: [0.185, -0.10715, 0]}          # its two pins
      pinR: {at: [0.185, 0.10715, 0]}
      slot: {at: ["0.185*cos(1*2*pi/6) - (-0.10715)*sin(1*2*pi/6)", "0.185*sin(1*2*pi/6) + (-0.10715)*cos(1*2*pi/6)", 0], z: ["-sin(2*pi/6)", "cos(2*pi/6)", 0]}          # its right slot: z across it
      slotAlong: {at: ["0.185*cos(1*2*pi/6) - (-0.10715)*sin(1*2*pi/6)", "0.185*sin(1*2*pi/6) + (-0.10715)*cos(1*2*pi/6)", 0], z: ["cos(2*pi/6)", "sin(2*pi/6)", 0]}      # ... and z along it, outward
      corner: {at: ["0.185*cos(-1*2*pi/6) - (0.10715)*sin(-1*2*pi/6)", "0.185*sin(-1*2*pi/6) + (0.10715)*cos(-1*2*pi/6)", 0], z: ["sin(2*pi/6)", "cos(2*pi/6)", 0]}       # its corner slot, likewise
      cornerAlong: {at: ["0.185*cos(-1*2*pi/6) - (0.10715)*sin(-1*2*pi/6)", "0.185*sin(-1*2*pi/6) + (0.10715)*cos(-1*2*pi/6)", 0], z: ["cos(2*pi/6)", "-sin(2*pi/6)", 0]}
  carX: {frames: {sx: {z: [1, 0, 0]}, sy: {z: [0, 1, 0]}}}     # carriers: they only chain the slides
  carY: {frames: {sy: {z: [0, 1, 0]}}}
  prev:       # fixed: the slot of segment i-1 (beside it, one step higher)
    shape:
      union:
        - {box: [0.0189, 0.0049, 0.0292], at: [0.19055, -0.101, 0.1336]}
        - {box: [0.0189, 0.004521, 0.0292], at: [0.19055, -0.11311, 0.1336]}
        - {box: [0.0045, 0.016821, 0.0292], at: [0.17885, -0.10696, 0.1336]}
        - {box: [0.0195, 0.016821, 0.0142], at: [0.19025, -0.10696, 0.1769]}
  above:      # fixed: the corner slot of segment i-N+1 (above its right end)
    shape:
      union:
        - {box: [0.0189, 0.0049, 0.013], at: [0.19055, 0.101, 0.208]}
        - {box: [0.0189, 0.004521, 0.013], at: [0.19055, 0.11311, 0.208]}
        - {box: [0.0045, 0.016821, 0.013], at: [0.17885, 0.10696, 0.208]}
  keyL:       # segment i: left finger and pin
    shape:
      union:
        - {box: [0.014, 0.0165, 0.018], at: [0.188, -0.1024, 0.159]}
        - {hull: [[0.1884, -0.10635, 0.122], [0.1884, -0.10635, 0.15], [0.1858, -0.10375, 0.122], [0.1858, -0.10375, 0.15], [0.1842, -0.10375, 0.122], [0.1842, -0.10375, 0.15], [0.1816, -0.10635, 0.122], [0.1816, -0.10635, 0.15], [0.1816, -0.10795, 0.122], [0.1816, -0.10795, 0.15], [0.1842, -0.11055, 0.122], [0.1842, -0.11055, 0.15], [0.1858, -0.11055, 0.122], [0.1858, -0.11055, 0.15], [0.1884, -0.10795, 0.122], [0.1884, -0.10795, 0.15]]}
  keyR:       # segment i: right finger and pin
    shape:
      union:
        - {box: [0.014, 0.0165, 0.016], at: [0.188, 0.1024, 0.226]}
        - {hull: [[0.1884, 0.10795, 0.203], [0.1884, 0.10795, 0.218], [0.1858, 0.11055, 0.203], [0.1858, 0.11055, 0.218], [0.1842, 0.11055, 0.203], [0.1842, 0.11055, 0.218], [0.1816, 0.10795, 0.203], [0.1816, 0.10795, 0.218], [0.1816, 0.10635, 0.203], [0.1816, 0.10635, 0.218], [0.1842, 0.10375, 0.203], [0.1842, 0.10375, 0.218], [0.1858, 0.10375, 0.203], [0.1858, 0.10375, 0.218], [0.1884, 0.10635, 0.203], [0.1884, 0.10635, 0.218]]}
  slot:       # segment i: the slot at its right end
    shape:
      union:
        - {box: [0.0189, 0.0049, 0.0292], at: ["0.19055*cos(1*2*pi/6) - (-0.101)*sin(1*2*pi/6)", "0.19055*sin(1*2*pi/6) + (-0.101)*cos(1*2*pi/6)", 0.0936], x: ["cos(1*2*pi/6)", "sin(1*2*pi/6)", 0]}
        - {box: [0.0189, 0.004521, 0.0292], at: ["0.19055*cos(1*2*pi/6) - (-0.11311)*sin(1*2*pi/6)", "0.19055*sin(1*2*pi/6) + (-0.11311)*cos(1*2*pi/6)", 0.0936], x: ["cos(1*2*pi/6)", "sin(1*2*pi/6)", 0]}
        - {box: [0.0045, 0.016821, 0.0292], at: ["0.17885*cos(1*2*pi/6) - (-0.10696)*sin(1*2*pi/6)", "0.17885*sin(1*2*pi/6) + (-0.10696)*cos(1*2*pi/6)", 0.0936], x: ["cos(1*2*pi/6)", "sin(1*2*pi/6)", 0]}
        - {box: [0.0195, 0.016821, 0.0142], at: ["0.19025*cos(1*2*pi/6) - (-0.10696)*sin(1*2*pi/6)", "0.19025*sin(1*2*pi/6) + (-0.10696)*cos(1*2*pi/6)", 0.1369], x: ["cos(1*2*pi/6)", "sin(1*2*pi/6)", 0]}
  corner:     # segment i: the slot at its lower left corner
    shape:
      union:
        - {box: [0.0189, 0.0049, 0.013], at: ["0.19055*cos(-1*2*pi/6) - (0.101)*sin(-1*2*pi/6)", "0.19055*sin(-1*2*pi/6) + (0.101)*cos(-1*2*pi/6)", 0.008], x: ["cos(-1*2*pi/6)", "sin(-1*2*pi/6)", 0]}
        - {box: [0.0189, 0.004521, 0.013], at: ["0.19055*cos(-1*2*pi/6) - (0.11311)*sin(-1*2*pi/6)", "0.19055*sin(-1*2*pi/6) + (0.11311)*cos(-1*2*pi/6)", 0.008], x: ["cos(-1*2*pi/6)", "sin(-1*2*pi/6)", 0]}
        - {box: [0.0045, 0.016821, 0.013], at: ["0.17885*cos(-1*2*pi/6) - (0.10696)*sin(-1*2*pi/6)", "0.17885*sin(-1*2*pi/6) + (0.10696)*cos(-1*2*pi/6)", 0.008], x: ["cos(-1*2*pi/6)", "sin(-1*2*pi/6)", 0]}
  next:       # segment i+1: its left finger and pin (one step lower)
    frames: {rad: {z: ["cos(2*pi/6)", "sin(2*pi/6)", 0]}}
    shape:
      union:
        - {box: [0.014, 0.0165, 0.018], at: ["0.188*cos(1*2*pi/6) - (-0.1024)*sin(1*2*pi/6)", "0.188*sin(1*2*pi/6) + (-0.1024)*cos(1*2*pi/6)", 0.119], x: ["cos(1*2*pi/6)", "sin(1*2*pi/6)", 0]}
        - {hull: [["0.1884*cos(1*2*pi/6) - (-0.10635)*sin(1*2*pi/6)", "0.1884*sin(1*2*pi/6) + (-0.10635)*cos(1*2*pi/6)", 0.082], ["0.1884*cos(1*2*pi/6) - (-0.10635)*sin(1*2*pi/6)", "0.1884*sin(1*2*pi/6) + (-0.10635)*cos(1*2*pi/6)", 0.11], ["0.1858*cos(1*2*pi/6) - (-0.10375)*sin(1*2*pi/6)", "0.1858*sin(1*2*pi/6) + (-0.10375)*cos(1*2*pi/6)", 0.082], ["0.1858*cos(1*2*pi/6) - (-0.10375)*sin(1*2*pi/6)", "0.1858*sin(1*2*pi/6) + (-0.10375)*cos(1*2*pi/6)", 0.11], ["0.1842*cos(1*2*pi/6) - (-0.10375)*sin(1*2*pi/6)", "0.1842*sin(1*2*pi/6) + (-0.10375)*cos(1*2*pi/6)", 0.082], ["0.1842*cos(1*2*pi/6) - (-0.10375)*sin(1*2*pi/6)", "0.1842*sin(1*2*pi/6) + (-0.10375)*cos(1*2*pi/6)", 0.11], ["0.1816*cos(1*2*pi/6) - (-0.10635)*sin(1*2*pi/6)", "0.1816*sin(1*2*pi/6) + (-0.10635)*cos(1*2*pi/6)", 0.082], ["0.1816*cos(1*2*pi/6) - (-0.10635)*sin(1*2*pi/6)", "0.1816*sin(1*2*pi/6) + (-0.10635)*cos(1*2*pi/6)", 0.11], ["0.1816*cos(1*2*pi/6) - (-0.10795)*sin(1*2*pi/6)", "0.1816*sin(1*2*pi/6) + (-0.10795)*cos(1*2*pi/6)", 0.082], ["0.1816*cos(1*2*pi/6) - (-0.10795)*sin(1*2*pi/6)", "0.1816*sin(1*2*pi/6) + (-0.10795)*cos(1*2*pi/6)", 0.11], ["0.1842*cos(1*2*pi/6) - (-0.11055)*sin(1*2*pi/6)", "0.1842*sin(1*2*pi/6) + (-0.11055)*cos(1*2*pi/6)", 0.082], ["0.1842*cos(1*2*pi/6) - (-0.11055)*sin(1*2*pi/6)", "0.1842*sin(1*2*pi/6) + (-0.11055)*cos(1*2*pi/6)", 0.11], ["0.1858*cos(1*2*pi/6) - (-0.11055)*sin(1*2*pi/6)", "0.1858*sin(1*2*pi/6) + (-0.11055)*cos(1*2*pi/6)", 0.082], ["0.1858*cos(1*2*pi/6) - (-0.11055)*sin(1*2*pi/6)", "0.1858*sin(1*2*pi/6) + (-0.11055)*cos(1*2*pi/6)", 0.11], ["0.1884*cos(1*2*pi/6) - (-0.10795)*sin(1*2*pi/6)", "0.1884*sin(1*2*pi/6) + (-0.10795)*cos(1*2*pi/6)", 0.082], ["0.1884*cos(1*2*pi/6) - (-0.10795)*sin(1*2*pi/6)", "0.1884*sin(1*2*pi/6) + (-0.10795)*cos(1*2*pi/6)", 0.11]]}
  low:        # segment i+N-1: its right finger and pin (below segment i-1)
    frames: {rad: {z: ["cos(-2*pi/6)", "sin(-2*pi/6)", 0]}}
    shape:
      union:
        - {box: [0.014, 0.0165, 0.016], at: ["0.188*cos(-1*2*pi/6) - (0.1024)*sin(-1*2*pi/6)", "0.188*sin(-1*2*pi/6) + (0.1024)*cos(-1*2*pi/6)", 0.026], x: ["cos(-1*2*pi/6)", "sin(-1*2*pi/6)", 0]}
        - {hull: [["0.1884*cos(-1*2*pi/6) - (0.10795)*sin(-1*2*pi/6)", "0.1884*sin(-1*2*pi/6) + (0.10795)*cos(-1*2*pi/6)", 0.003], ["0.1884*cos(-1*2*pi/6) - (0.10795)*sin(-1*2*pi/6)", "0.1884*sin(-1*2*pi/6) + (0.10795)*cos(-1*2*pi/6)", 0.018], ["0.1858*cos(-1*2*pi/6) - (0.11055)*sin(-1*2*pi/6)", "0.1858*sin(-1*2*pi/6) + (0.11055)*cos(-1*2*pi/6)", 0.003], ["0.1858*cos(-1*2*pi/6) - (0.11055)*sin(-1*2*pi/6)", "0.1858*sin(-1*2*pi/6) + (0.11055)*cos(-1*2*pi/6)", 0.018], ["0.1842*cos(-1*2*pi/6) - (0.11055)*sin(-1*2*pi/6)", "0.1842*sin(-1*2*pi/6) + (0.11055)*cos(-1*2*pi/6)", 0.003], ["0.1842*cos(-1*2*pi/6) - (0.11055)*sin(-1*2*pi/6)", "0.1842*sin(-1*2*pi/6) + (0.11055)*cos(-1*2*pi/6)", 0.018], ["0.1816*cos(-1*2*pi/6) - (0.10795)*sin(-1*2*pi/6)", "0.1816*sin(-1*2*pi/6) + (0.10795)*cos(-1*2*pi/6)", 0.003], ["0.1816*cos(-1*2*pi/6) - (0.10795)*sin(-1*2*pi/6)", "0.1816*sin(-1*2*pi/6) + (0.10795)*cos(-1*2*pi/6)", 0.018], ["0.1816*cos(-1*2*pi/6) - (0.10635)*sin(-1*2*pi/6)", "0.1816*sin(-1*2*pi/6) + (0.10635)*cos(-1*2*pi/6)", 0.003], ["0.1816*cos(-1*2*pi/6) - (0.10635)*sin(-1*2*pi/6)", "0.1816*sin(-1*2*pi/6) + (0.10635)*cos(-1*2*pi/6)", 0.018], ["0.1842*cos(-1*2*pi/6) - (0.10375)*sin(-1*2*pi/6)", "0.1842*sin(-1*2*pi/6) + (0.10375)*cos(-1*2*pi/6)", 0.003], ["0.1842*cos(-1*2*pi/6) - (0.10375)*sin(-1*2*pi/6)", "0.1842*sin(-1*2*pi/6) + (0.10375)*cos(-1*2*pi/6)", 0.018], ["0.1858*cos(-1*2*pi/6) - (0.10375)*sin(-1*2*pi/6)", "0.1858*sin(-1*2*pi/6) + (0.10375)*cos(-1*2*pi/6)", 0.003], ["0.1858*cos(-1*2*pi/6) - (0.10375)*sin(-1*2*pi/6)", "0.1858*sin(-1*2*pi/6) + (0.10375)*cos(-1*2*pi/6)", 0.018], ["0.1884*cos(-1*2*pi/6) - (0.10635)*sin(-1*2*pi/6)", "0.1884*sin(-1*2*pi/6) + (0.10635)*cos(-1*2*pi/6)", 0.003], ["0.1884*cos(-1*2*pi/6) - (0.10635)*sin(-1*2*pi/6)", "0.1884*sin(-1*2*pi/6) + (0.10635)*cos(-1*2*pi/6)", 0.018]]}
constraints:
  # solid
  - fixed: [world, prev]
  - fixed: [world, above]
  - prismatic: [world.sx, carX.sx]      # out of the tower
    name: out
  - prismatic: [carX.sy, carY.sy]       # along the wall
    name: side
  - prismatic: [carY, keyL]             # up
    name: up
  - fixed: [keyL, keyR]
  - fixed: [keyL, slot]
  - fixed: [keyL, corner]
  - prismatic: [world.nextRad, next.rad]
    name: next
  - prismatic: [world.lowRad, low.rad]
    name: low
  - no_overlap: [keyL, prev]
  - no_overlap: [keyR, above]
  - no_overlap: [slot, next]
  - no_overlap: [corner, low]
  # flat
  - planar: [world.mid, flat.mid]       # x: out of the tower, y: along the wall, and the turn
    name: seg

claims:
  # solid: within 6 mm of its place in every direction, with the pin of segment i+1 at most 6 mm
  # from its place, segment i is within a millimetre (two millimetres up and down)
  - name: held
    always: "implies(-0.006 <= out.d <= 0.006 and -0.006 <= side.d <= 0.006 and -0.006 <= up.d <= 0.006 and -0.006 <= next.d <= 0.006, -0.001 <= out.d <= 0.001 and -0.001 <= side.d <= 0.001 and -0.002 <= up.d <= 0.002)"
  - name: comesOutLast                  # with both later segments drawn out, it slides straight out
    possible: "next.d >= 0.03 and low.d >= 0.03 and out.d >= 0.03 and side.d == 0 and up.d == 0"
  - name: neverComesOut                 # false on purpose: the prover should find the way out
    always: "out.d <= 0.002"
  # flat: turned less than 25 degrees, with all four pins in their channels, segment i is within
  # 0.6 mm and a third of a degree (one claim per bound: z3 decides them much faster apart)
  - name: pinnedOutward
    always: "implies(seg.c >= 9/10 and -0.0002 <= pos(flat.pinL).y - (-0.10715) <= 0.0002 and pos(flat.pinL).x >= 0.1846 and -0.0002 <= pos(flat.pinR).y - (0.10715) <= 0.0002 and pos(flat.pinR).x >= 0.1846 and -0.0002 <= dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slot)) <= 0.0002 and dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slotAlong)) >= -0.0004 and -0.0002 <= dot(pos(world.lowPin) - pos(flat.corner), axis(flat.corner)) <= 0.0002 and dot(pos(world.lowPin) - pos(flat.corner), axis(flat.cornerAlong)) >= -0.0004, seg.x <= 0.0006)"
  - name: pinnedInward
    always: "implies(seg.c >= 9/10 and -0.0002 <= pos(flat.pinL).y - (-0.10715) <= 0.0002 and pos(flat.pinL).x >= 0.1846 and -0.0002 <= pos(flat.pinR).y - (0.10715) <= 0.0002 and pos(flat.pinR).x >= 0.1846 and -0.0002 <= dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slot)) <= 0.0002 and dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slotAlong)) >= -0.0004 and -0.0002 <= dot(pos(world.lowPin) - pos(flat.corner), axis(flat.corner)) <= 0.0002 and dot(pos(world.lowPin) - pos(flat.corner), axis(flat.cornerAlong)) >= -0.0004, seg.x >= -0.0006)"
  - name: pinnedSideways
    always: "implies(seg.c >= 9/10 and -0.0002 <= pos(flat.pinL).y - (-0.10715) <= 0.0002 and pos(flat.pinL).x >= 0.1846 and -0.0002 <= pos(flat.pinR).y - (0.10715) <= 0.0002 and pos(flat.pinR).x >= 0.1846 and -0.0002 <= dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slot)) <= 0.0002 and dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slotAlong)) >= -0.0004 and -0.0002 <= dot(pos(world.lowPin) - pos(flat.corner), axis(flat.corner)) <= 0.0002 and dot(pos(world.lowPin) - pos(flat.corner), axis(flat.cornerAlong)) >= -0.0004, -0.0004 <= seg.y <= 0.0004)"
  - name: pinnedTurningOneWay
    always: "implies(seg.c >= 9/10 and -0.0002 <= pos(flat.pinL).y - (-0.10715) <= 0.0002 and pos(flat.pinL).x >= 0.1846 and -0.0002 <= pos(flat.pinR).y - (0.10715) <= 0.0002 and pos(flat.pinR).x >= 0.1846 and -0.0002 <= dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slot)) <= 0.0002 and dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slotAlong)) >= -0.0004 and -0.0002 <= dot(pos(world.lowPin) - pos(flat.corner), axis(flat.corner)) <= 0.0002 and dot(pos(world.lowPin) - pos(flat.corner), axis(flat.cornerAlong)) >= -0.0004, seg.s <= 0.005)"
  - name: pinnedTurningOtherWay
    always: "implies(seg.c >= 9/10 and -0.0002 <= pos(flat.pinL).y - (-0.10715) <= 0.0002 and pos(flat.pinL).x >= 0.1846 and -0.0002 <= pos(flat.pinR).y - (0.10715) <= 0.0002 and pos(flat.pinR).x >= 0.1846 and -0.0002 <= dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slot)) <= 0.0002 and dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slotAlong)) >= -0.0004 and -0.0002 <= dot(pos(world.lowPin) - pos(flat.corner), axis(flat.corner)) <= 0.0002 and dot(pos(world.lowPin) - pos(flat.corner), axis(flat.cornerAlong)) >= -0.0004, seg.s >= -0.005)"
  - name: swingsWithoutLowerPin         # before segment i+N-1 is in, the left end can swing out by 6 mm
    possible: "seg.c >= 9/10 and -0.0002 <= pos(flat.pinL).y - (-0.10715) <= 0.0002 and pos(flat.pinL).x >= 0.1846 and -0.0002 <= pos(flat.pinR).y - (0.10715) <= 0.0002 and pos(flat.pinR).x >= 0.1846 and -0.0002 <= dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slot)) <= 0.0002 and dot(pos(world.nextPin) - pos(flat.slot), axis(flat.slotAlong)) >= -0.0004 and seg.s >= 0.03"
  - name: slidesOnItsOwnPins            # and with neither later segment, it slides straight out
    possible: "-0.0002 <= pos(flat.pinL).y - (-0.10715) <= 0.0002 and pos(flat.pinL).x >= 0.1846 and -0.0002 <= pos(flat.pinR).y - (0.10715) <= 0.0002 and pos(flat.pinR).x >= 0.1846 and seg.x >= 0.03 and seg.y == 0 and seg.s == 0 and seg.c == 1"
