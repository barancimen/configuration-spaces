# Ratchet drive: generated by examples/make_ratchet_drive.py (edit that, then rerun it).
# The mechanism (metres; all motion in planes parallel to xy):
#   lever       oscillates about the ratchet axle, driven by a motor
#   drivePawl   on the lever, spring-loaded: pushes a ratchet tooth on each forward stroke and
#               slides back over the teeth on the return stroke
#   ratchet     12 sawtooth teeth around a hub, plus gear A (24 teeth) on the same body
#   holdPawl    on the frame, spring-loaded: stops the ratchet from turning back (the latch)
#   gearB       idler (12 teeth), gearC output (20 teeth): exact gear couplings
#   rod, slider a crank pin on gearC drives a connecting rod and a slider on a rail (a closed loop)
#   catch       spring-loaded detent that clicks into a V-notch on the slider
#   frame       base plate
# Pawls lie along the tangent of the tooth circle at their contact point, so a blocked tooth pushes
# straight along the pawl toward its pivot. Contacts and springs are simulation-only (MuJoCo).
name: ratchet_drive
bodies:
  world:
    frames:
      axle: {}                                      # ratchet and lever turn about this axis
      holdPivot: {at: [0.08, 0.1, 0]}
      axleB: {at: [0.09, 0, 0]}
      axleC: {at: [0.17, 0, 0]}
      rail: {at: [0.17, 0, -0.045], z: [1, 0, 0]}   # the slider moves along x
      catchPivot: {at: [0.36, 0.03, -0.045]}
  frame:
    color: "#3b4652"
    shape: {box: [0.52, 0.3, 0.005], at: [0.16, 0.03, -0.06]}
  ratchet:
    color: "#b8862b"
    shape:
      union:
        - {cylinder: [0.075, 0.02]}                    # hub
        - {cylinder: [0.06, 0.01], at: [0, 0, -0.03]}  # gear A, 24 teeth (coupling, no tooth contact)
        - hull: [[0.0720, 0.0000, -0.0100], [0.0720, 0.0000, 0.0100], [0.1000, 0.0000, -0.0100], [0.1000, 0.0000, 0.0100], [0.0624, 0.0360, -0.0100], [0.0624, 0.0360, 0.0100]]
        - hull: [[0.0624, 0.0360, -0.0100], [0.0624, 0.0360, 0.0100], [0.0866, 0.0500, -0.0100], [0.0866, 0.0500, 0.0100], [0.0360, 0.0624, -0.0100], [0.0360, 0.0624, 0.0100]]
        - hull: [[0.0360, 0.0624, -0.0100], [0.0360, 0.0624, 0.0100], [0.0500, 0.0866, -0.0100], [0.0500, 0.0866, 0.0100], [0.0000, 0.0720, -0.0100], [0.0000, 0.0720, 0.0100]]
        - hull: [[0.0000, 0.0720, -0.0100], [0.0000, 0.0720, 0.0100], [0.0000, 0.1000, -0.0100], [0.0000, 0.1000, 0.0100], [-0.0360, 0.0624, -0.0100], [-0.0360, 0.0624, 0.0100]]
        - hull: [[-0.0360, 0.0624, -0.0100], [-0.0360, 0.0624, 0.0100], [-0.0500, 0.0866, -0.0100], [-0.0500, 0.0866, 0.0100], [-0.0624, 0.0360, -0.0100], [-0.0624, 0.0360, 0.0100]]
        - hull: [[-0.0624, 0.0360, -0.0100], [-0.0624, 0.0360, 0.0100], [-0.0866, 0.0500, -0.0100], [-0.0866, 0.0500, 0.0100], [-0.0720, 0.0000, -0.0100], [-0.0720, 0.0000, 0.0100]]
        - hull: [[-0.0720, 0.0000, -0.0100], [-0.0720, 0.0000, 0.0100], [-0.1000, 0.0000, -0.0100], [-0.1000, 0.0000, 0.0100], [-0.0624, -0.0360, -0.0100], [-0.0624, -0.0360, 0.0100]]
        - hull: [[-0.0624, -0.0360, -0.0100], [-0.0624, -0.0360, 0.0100], [-0.0866, -0.0500, -0.0100], [-0.0866, -0.0500, 0.0100], [-0.0360, -0.0624, -0.0100], [-0.0360, -0.0624, 0.0100]]
        - hull: [[-0.0360, -0.0624, -0.0100], [-0.0360, -0.0624, 0.0100], [-0.0500, -0.0866, -0.0100], [-0.0500, -0.0866, 0.0100], [-0.0000, -0.0720, -0.0100], [-0.0000, -0.0720, 0.0100]]
        - hull: [[-0.0000, -0.0720, -0.0100], [-0.0000, -0.0720, 0.0100], [-0.0000, -0.1000, -0.0100], [-0.0000, -0.1000, 0.0100], [0.0360, -0.0624, -0.0100], [0.0360, -0.0624, 0.0100]]
        - hull: [[0.0360, -0.0624, -0.0100], [0.0360, -0.0624, 0.0100], [0.0500, -0.0866, -0.0100], [0.0500, -0.0866, 0.0100], [0.0624, -0.0360, -0.0100], [0.0624, -0.0360, 0.0100]]
        - hull: [[0.0624, -0.0360, -0.0100], [0.0624, -0.0360, 0.0100], [0.0866, -0.0500, -0.0100], [0.0866, -0.0500, 0.0100], [0.0720, -0.0000, -0.0100], [0.0720, -0.0000, 0.0100]]
  lever:
    color: "#3f6f9f"
    shape: {hull: [[0.0055, -0.0172, 0.0210], [0.0055, -0.0172, 0.0290], [0.0180, -0.0016, 0.0210], [0.0180, -0.0016, 0.0290], [-0.1055, 0.0972, 0.0210], [-0.1055, 0.0972, 0.0290], [-0.1180, 0.0816, 0.0210], [-0.1180, 0.0816, 0.0290]]}
    frames: {pawlPivot: {at: [-0.1, 0.08, 0]}}
  drivePawl:                                       # along the tangent at (-0.1, 0); hook reaches into the teeth
    color: "#8a96a3"
    shape:
      union:
        - hull: [[-0.0120, 0.0040, -0.0080], [-0.0120, 0.0040, 0.0080], [0.0000, 0.0040, -0.0080], [0.0000, 0.0040, 0.0080], [0.0000, -0.0750, -0.0080], [0.0000, -0.0750, 0.0080], [-0.0120, -0.0750, -0.0080], [-0.0120, -0.0750, 0.0080]]
        - hull: [[-0.0060, -0.0660, -0.0080], [-0.0060, -0.0660, 0.0080], [0.0000, -0.0660, -0.0080], [0.0000, -0.0660, 0.0080], [0.0130, -0.0820, -0.0080], [0.0130, -0.0820, 0.0080], [-0.0040, -0.0840, -0.0080], [-0.0040, -0.0840, 0.0080]]
  holdPawl:                                        # along the tangent at (0, 0.1)
    color: "#8a96a3"
    shape:
      union:
        - hull: [[0.0040, 0.0000, -0.0080], [0.0040, 0.0000, 0.0080], [0.0040, 0.0120, -0.0080], [0.0040, 0.0120, 0.0080], [-0.0750, 0.0120, -0.0080], [-0.0750, 0.0120, 0.0080], [-0.0750, 0.0000, -0.0080], [-0.0750, 0.0000, 0.0080]]
        - hull: [[-0.0660, 0.0060, -0.0080], [-0.0660, 0.0060, 0.0080], [-0.0660, 0.0000, -0.0080], [-0.0660, 0.0000, 0.0080], [-0.0820, -0.0130, -0.0080], [-0.0820, -0.0130, 0.0080], [-0.0840, 0.0040, -0.0080], [-0.0840, 0.0040, 0.0080]]
  gearB:
    color: "#a3592e"
    shape:
      union:
        - {cylinder: [0.03, 0.01], at: [0, 0, -0.03]}
        - {box: [0.05, 0.006, 0.012], at: [0, 0, -0.03]}     # spoke, to see it turn
  gearC:
    color: "#3f8a78"
    shape:
      union:
        - {cylinder: [0.05, 0.01], at: [0, 0, -0.03]}
        - {box: [0.09, 0.008, 0.012], at: [0, 0, -0.03]}
    frames: {pin: {at: [0.035, 0, -0.045]}}
  rod:
    color: "#6c5c9e"
    shape: {box: [0.15, 0.008, 0.004], at: [0.075, 0, 0]}
    frames: {a: {}, b: {at: [0.15, 0, 0]}}
  slider:                                          # a block with a V-notch on top
    color: "#5b7f2e"
    shape:
      union:
        - {box: [0.06, 0.02, 0.01]}
        - hull: [[-0.0300, 0.0100, -0.0050], [-0.0300, 0.0100, 0.0050], [-0.0010, 0.0100, -0.0050], [-0.0010, 0.0100, 0.0050], [-0.0070, 0.0180, -0.0050], [-0.0070, 0.0180, 0.0050], [-0.0300, 0.0180, -0.0050], [-0.0300, 0.0180, 0.0050]]
        - hull: [[0.0010, 0.0100, -0.0050], [0.0010, 0.0100, 0.0050], [0.0300, 0.0100, -0.0050], [0.0300, 0.0100, 0.0050], [0.0300, 0.0180, -0.0050], [0.0300, 0.0180, 0.0050], [0.0070, 0.0180, -0.0050], [0.0070, 0.0180, 0.0050]]
    frames: {rail: {z: [1, 0, 0]}, pin: {}}
  catch:                                           # detent arm with a V tip
    color: "#8d3d4a"
    shape:
      union:
        - hull: [[0.0030, 0.0000, -0.0040], [0.0030, 0.0000, 0.0040], [0.0030, 0.0080, -0.0040], [0.0030, 0.0080, 0.0040], [-0.0400, 0.0080, -0.0040], [-0.0400, 0.0080, 0.0040], [-0.0400, 0.0000, -0.0040], [-0.0400, 0.0000, 0.0040]]
        - hull: [[-0.0460, 0.0010, -0.0040], [-0.0460, 0.0010, 0.0040], [-0.0340, 0.0010, -0.0040], [-0.0340, 0.0010, 0.0040], [-0.0400, -0.0120, -0.0040], [-0.0400, -0.0120, 0.0040]]
constraints:
  - fixed: [world, frame]
  - revolute: [world.axle, ratchet]
    name: ratchet
  - revolute: [world.axle, lever]
    name: lever
    range: [-0.6, 0.6]
  - revolute: [lever.pawlPivot, drivePawl]
    name: drivePawl
    spring: {stiffness: 0.02, rest: 0.35, damping: 0.001}     # positive angle pushes into the teeth
  - revolute: [world.holdPivot, holdPawl]
    name: holdPawl
    spring: {stiffness: 0.02, rest: 0.35, damping: 0.001}
  - revolute: [world.axleB, gearB]
    name: gearB
  - revolute: [world.axleC, gearC]
    name: gearC
  - gear: [ratchet, gearB]
    teeth: [24, 12]
  - gear: [gearB, gearC]
    teeth: [12, 20]
  - revolute: [gearC.pin, rod.a]
    name: crankPin
  - prismatic: [world.rail, slider.rail]
    name: slide
    range: [0.08, 0.22]
  - revolute: [rod.b, slider.pin]                  # closes the slider-crank loop
    name: wristPin
  - revolute: [world.catchPivot, catch]
    name: catch
    spring: {stiffness: 0.005, rest: 0.3, damping: 0.0001}
  # simulation only: these bodies push on each other in MuJoCo
  - contact: [drivePawl, ratchet]
    friction: 0.2
  - contact: [holdPawl, ratchet]
    friction: 0.2
  - contact: [catch, slider]
    friction: 0.2

start:                     # pawls and catch lifted clear; the springs drop them in
  lever: 0
  ratchet: 0
  drivePawl: -0.25
  holdPawl: -0.25
  catch: -0.25

simulation:
  gravity: false           # the mechanism lies flat
  timestep: 0.0005
  motors:
    lever: {kp: 5, damping: 0.05}
#   python3 -m cspace.mjcf examples/ratchet_drive.yaml -o ratchet.xml
#   python3 examples/simulate_mujoco.py ratchet.xml --wiggle --amplitude 0.35 --frequency 0.5 --view
