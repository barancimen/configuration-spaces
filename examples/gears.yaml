# Two meshing gears on fixed axles, 20 and 40 teeth. The wheel's hinge is limited to a
# quarter turn either way. The coupling relates two joints, not two bodies.
name: gears
bodies:
  world:
    frames: {axle1: {}, axle2: {at: [3, 0, 0]}}
  pinion:
    frames: {hub: {}}
  wheel:
    frames: {hub: {}}
constraints:
  - revolute: [world.axle1, pinion.hub]
    name: p
  - revolute: [world.axle2, wheel.hub]
    name: w
    range: [-pi/2, pi/2]
  - gear: [p, w]
    teeth: [20, 40]

claims:
  - name: pinionDoubleAngle        # cos(-2w) = 2 cos(w)^2 - 1
    always: "p.c == 2*w.c^2 - 1"
  - name: turnOppositeWays         # needs the wheel's range
    always: "p.s * w.s <= 0"
  - name: pinionHalfTurn
    possible: "p.c == -1"
  - name: everyWheelAngle          # the gear train never jams within the wheel's range
    given: [w]
    possible: "True"
